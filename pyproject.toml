[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxr"
version = "0.0.1"
description = "Acquisition-aware fairness analysis for chest X-ray classifiers"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "pyyaml",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
train = ["torch", "torchvision", "pillow"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["pxr"]

[tool.ruff.lint.per-file-ignores]
"tests/test_train.py" = ["E402"]