meta:
  study: patient-or-xray
  config_version: "0.1.0"          
  title: >-
    Is It the Patient or the X-Ray? Disentangling Demographic and
    Acquisition-Driven Bias in Chest X-Ray AI Across Three Institutions

# -----------------------------------------------------------------------------
# Paths 
# -----------------------------------------------------------------------------
paths:
  drive_root: /content/drive/MyDrive/patient-or-xray
  raw_zips: data/raw_zips
  metadata: data/metadata
  cohorts: data/cohorts
  image_cache: data/image_cache
  splits: data/splits
  models: models
  scores: outputs/scores
  calibration: outputs/calibration
  analysis: outputs/analysis
  figures: outputs/figures
  tables: outputs/tables
  local_scratch: /content/scratch          

# -----------------------------------------------------------------------------
# Sites
# -----------------------------------------------------------------------------
sites:
  mimic-cxr:
    display_name: MIMIC-CXR
    role: primary_source                   
    metadata_files:
      records: mimic-cxr-2.0.0-metadata.csv     
      labels: mimic-cxr-2.0.0-chexpert.csv      
      patients: null                            
    keys:
      patient: subject_id
      study: study_id
      image: dicom_id
      view: ViewPosition
    label_schema: chexpert14
    uncertain_labels: true
    image_key_depth: 1                     
  chexpert:
    display_name: CheXpert
    role: external
    metadata_files:
      records: train.csv
      records_extra: valid.csv          
    keys:
      patient: null                        
      study: null                          
      image: Path
      view: "AP/PA"
    label_schema: chexpert14
    uncertain_labels: true
    image_key_depth: 3
    image_key_pattern: 'patient(\d+)[/_]study(\d+)[/_](view\d+_[a-zA-Z]+)' 
  nih:
    display_name: NIH ChestX-ray14
    role: external
    metadata_files:
      records: Data_Entry_2017.csv
    keys:
      patient: "Patient ID"
      study: "Image Index"                 
      image: "Image Index"
      view: "View Position"
    label_schema: nih14
    uncertain_labels: false
    image_key_depth: 1                     

# -----------------------------------------------------------------------------
# Labels
# -----------------------------------------------------------------------------
labels:
  analysis:
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Pneumonia
    - Pneumothorax
    - Pleural Effusion
    - No Finding

  secondary_lane:
    - No Finding

  observation_schema:
    chexpert14:
      - Enlarged Cardiomediastinum
      - Cardiomegaly
      - Lung Opacity
      - Lung Lesion
      - Edema
      - Consolidation
      - Pneumonia
      - Atelectasis
      - Pneumothorax
      - Pleural Effusion
      - Pleural Other
      - Fracture
      - Support Devices
      - No Finding
    nih14:
      - Atelectasis
      - Cardiomegaly
      - Effusion
      - Infiltration
      - Mass
      - Nodule
      - Pneumonia
      - Pneumothorax
      - Consolidation
      - Edema
      - Emphysema
      - Fibrosis
      - Pleural_Thickening
      - Hernia
      - No Finding

  harmonisation:
    chexpert14: {}                         
    nih14:
      Effusion: Pleural Effusion
  uncertain_policy:
    primary: nan
    sensitivity: u_zeros

# -----------------------------------------------------------------------------
# Cohort construction
# -----------------------------------------------------------------------------
cohort:
  frontal_only: true
  allowed_views: [AP, PA]                 
  drop_missing_view: true
  adults_only: true
  age_min: 18
  age_max: 120
  one_image_per_patient: true
  selection_rule: earliest_study           # tiebreak: image_id
  selection_sensitivity_rule: latest_study
  min_archive_match_rate: 0.95
  require_image_present_in_archive: true   

# -----------------------------------------------------------------------------
# Demographics
# -----------------------------------------------------------------------------
demographics:
  sex_categories: [Male, Female]
  age_bins:
    edges: [18, 40, 60, 80, 121]
    labels: ["18-39", "40-59", "60-79", "80+"]
  strata: [sex, age_bin]                   

# -----------------------------------------------------------------------------
# Splits 
# -----------------------------------------------------------------------------
splits:
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  seed: 42
  stratify_by: [view, sex]
  note: >-
    Official MIMIC split is not used: its test set (275 patients) is far too small
    for subgroup fairness estimation. Documented in Methods.

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  architecture: densenet121
  pretrained: imagenet
  image_size: 224
  channels: 3                              
  batch_size: 32
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5
  max_epochs: 30
  early_stopping:
    monitor: val_macro_auroc               
    patience: 5
  seeds: [0, 1, 2]
  deterministic: true
  augmentation:                            
    horizontal_flip: false                
    rotation_degrees: 5
    translate_fraction: 0.05
    scale_range: [0.95, 1.05]
  primary_source: mimic-cxr
  secondary_source: chexpert               
  robustness_architecture: vit_b_16        

# -----------------------------------------------------------------------------
# Analysis
# -----------------------------------------------------------------------------
analysis:
  primary_endpoint: fnr_gap               
  secondary_endpoints: [fpr_gap, auroc_gap, auprc_gap, calibration_gap]
  threshold_rule:
    primary: fixed_sensitivity
    fixed_sensitivity_target: 0.90         
    sensitivity_rule: youden              
  standardization:
    reference: fixed_50_50                 
    reference_mix: {AP: 0.5, PA: 0.5}
    sensitivity_reference: pooled_source_validation
    applies_to: [fnr, fpr]                 
  calibration:
    primary: temperature_scaling         
    sensitivity: platt_scaling
    conditioning: [global, view]         
    fit_on: source_validation_only
  bootstrap:
    replicates: 2000
    method: patient_bootstrap
    ci: 0.95
  multiple_comparisons:
    primary_family: holm
    exploratory_family: benjamini_hochberg
  power:
    min_positives_warning: 25              
    target_power: 0.80
    alpha: 0.05
    simulation_replicates: 2000
    coarsening_ladder:                     
      - pool_age_bins_to_median_split
      - demote_label_to_exploratory
      - report_descriptively_only
  outcomes:                                
    attenuation: standardized_gap < raw_gap
    amplification: within_view_or_standardized_gap > raw_gap
    independence: standardized_gap ~= raw_gap